<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="web_dashboard" name="shell-type"/>
  <title>LG HT306 Audio Bridge</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body {
        background-color: #0E0E10;
        color: #F4F4F6;
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
        user-select: none;
      }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 9999px;
      background: #FFFFFF;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#0E0E10",
            surface: "#161618",
            "surface-2": "#1E1E22",
            "surface-3": "#28282E",
            "surface-dim": "#101012",
            "surface-variant": "#25252B",
            "surface-container-low": "#121214",
            "surface-container-lowest": "#0E0E10",
            "surface-container-high": "#222228",
            border: "#2A2A30",
            "border-subtle": "#202026",
            primary: "#E0245E",
            "primary-hover": "#C0184C",
            "primary-container": "#E0245E",
            "primary-fixed-dim": "#ff8aa6",
            "lg-red-hover": "#C0184C",
            "lg-red-pressed": "#9E123C",
            "status-ok": "#10B981",
            "status-warn": "#F59E0B",
            "status-error": "#EF4444",
            "status-info": "#5B9DFF",
            tertiary: "#10B981",
            "tertiary-container": "#064E3B",
            "tertiary-fixed": "#34D399",
            secondary: "#9E9EA8",
            "secondary-container": "#1E1E22",
            "text-primary": "#F4F4F6",
            "text-secondary": "#9E9EA8",
            "text-muted": "#5C5C66",
            "icon-gray": "#6B6B76",
            "on-surface": "#F4F4F6",
            text: {
              primary: "#F4F4F6",
              secondary: "#9E9EA8",
              muted: "#5C5C66"
            }
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-xl": "1.5rem",
            gutter: "1rem",
            "space-lg": "1rem",
            margin: "1.25rem"
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            "body-sm": ["Plus Jakarta Sans"],
            caption: ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "code-lg": ["JetBrains Mono"],
            "code-sm": ["JetBrains Mono"],
            "headline-md": ["Plus Jakarta Sans"],
            "meter-num": ["JetBrains Mono"]
          },
          fontSize: {
            "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            caption: ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "code-lg": ["14px", { lineHeight: "20px", fontWeight: "500" }],
            "code-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "headline-md": ["20px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "meter-num": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "600" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-sm text-text-primary select-none min-h-screen">
  <!-- Shared Global Top Bar -->
  <header class="fixed top-0 left-0 right-0 h-10 bg-surface-container-lowest/95 backdrop-blur z-50 flex items-center justify-between px-4 border-b border-border-subtle select-none">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1 text-primary">
        <span class="material-symbols-outlined text-[18px]">surround_sound</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-code-sm text-code-sm text-text-primary font-semibold tracking-tight">HT306 Audio Bridge</span>
        <span class="font-code-sm text-code-sm text-border">|</span>
        <span class="font-code-sm text-code-sm text-text-muted">RP2350 Direct-I2S</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div id="header-connection-badge" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-2 border border-border">
        <span id="header-status-dot" class="w-2 h-2 rounded-full bg-status-ok animate-pulse"></span>
        <span id="header-status-text" class="font-code-sm text-code-sm text-status-ok font-medium">Connected</span>
      </div>
      <!-- Windows Taskbar Audio Device Badge -->
      <button id="header-audio-badge" type="button" class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-2 border border-border cursor-pointer hover:bg-surface-3 transition-colors" title="Windows Taskbar Audio Device (Klik untuk switch/pasang driver)" onclick="window.handleAudioBadgeClick(event)">
        <span id="header-audio-dot" class="w-2 h-2 rounded-full bg-icon-gray"></span>
        <span class="material-symbols-outlined text-[14px] text-text-secondary">volume_up</span>
        <span id="header-audio-text" class="font-code-sm text-code-sm text-text-secondary font-medium">Taskbar: Detecting...</span>
      </button>
      <div class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-2 border border-border cursor-pointer hover:bg-surface-3 transition-colors" onclick="switchTab('profiles')">
        <span class="font-code-sm text-code-sm text-text-muted">Profile:</span>
        <span id="header-profile-text" class="font-code-sm text-code-sm text-text-primary font-medium">Movie</span>
        <span class="material-symbols-outlined text-text-secondary text-[16px]">arrow_drop_down</span>
      </div>
      <div class="flex items-center -mr-2 ml-1">
        <button id="btn-win-min" onclick="window.sendNativeCommand('window_minimize')" class="w-9 h-9 flex items-center justify-center text-text-secondary hover:bg-surface-2 hover:text-text-primary transition-colors cursor-pointer" type="button" title="Minimize"><span class="text-xs leading-none">─</span></button>
        <button id="btn-win-max" onclick="window.sendNativeCommand('window_maximize')" class="w-9 h-9 flex items-center justify-center text-text-secondary hover:bg-surface-2 hover:text-text-primary transition-colors cursor-pointer" type="button" title="Maximize"><span class="text-xs leading-none">▢</span></button>
        <button id="btn-win-close" onclick="window.sendNativeCommand('window_close')" class="w-9 h-9 flex items-center justify-center text-text-secondary hover:bg-status-error hover:text-white transition-colors cursor-pointer" type="button" title="Close"><span class="text-xs leading-none">✕</span></button>
      </div>
    </div>
  </header>

  <!-- Modern Minimalist Icon-Rail Sidebar -->
  <aside class="fixed left-0 top-10 bottom-0 w-16 bg-surface-container-low border-r border-border-subtle z-40 flex flex-col justify-between items-center py-4 select-none">
    <div class="flex flex-col items-center gap-3 w-full">
      <nav class="flex flex-col items-center gap-2 w-full px-2" id="sidebar-nav">
        <!-- Tab 1: Dashboard -->
        <button data-tab="dashboard" onclick="switchTab('dashboard')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all bg-primary text-white shadow-sm cursor-pointer" title="Dashboard">
          <span class="material-symbols-outlined text-[20px]">dashboard</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Dashboard
          </span>
        </button>

        <!-- Tab 2: Mixer -->
        <button data-tab="mixer" onclick="switchTab('mixer')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all text-text-secondary hover:bg-surface-2 hover:text-text-primary cursor-pointer" title="Mixer">
          <span class="material-symbols-outlined text-[20px]">tune</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Mixer
          </span>
        </button>

        <!-- Tab 3: Routing -->
        <button data-tab="routing" onclick="switchTab('routing')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all text-text-secondary hover:bg-surface-2 hover:text-text-primary cursor-pointer" title="Routing">
          <span class="material-symbols-outlined text-[20px]">alt_route</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Routing
          </span>
        </button>

        <!-- Tab 4: Profiles -->
        <button data-tab="profiles" onclick="switchTab('profiles')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all text-text-secondary hover:bg-surface-2 hover:text-text-primary cursor-pointer" title="Profiles">
          <span class="material-symbols-outlined text-[20px]">layers</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Profiles
          </span>
        </button>

        <!-- Tab 5: Test -->
        <button data-tab="test" onclick="switchTab('test')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all text-text-secondary hover:bg-surface-2 hover:text-text-primary cursor-pointer" title="Test">
          <span class="material-symbols-outlined text-[20px]">volume_up</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Speaker Test
          </span>
        </button>

        <!-- Tab 6: Log -->
        <button data-tab="log" onclick="switchTab('log')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all text-text-secondary hover:bg-surface-2 hover:text-text-primary cursor-pointer" title="Log">
          <span class="material-symbols-outlined text-[20px]">terminal</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Log
          </span>
        </button>

        <!-- Tab 7: Settings -->
        <button data-tab="settings" onclick="switchTab('settings')" class="nav-btn relative group w-10 h-10 rounded-xl flex items-center justify-center transition-all text-text-secondary hover:bg-surface-2 hover:text-text-primary cursor-pointer" title="Settings">
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs text-text-primary font-medium rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
            Settings
          </span>
        </button>
      </nav>
    </div>

    <!-- Bottom Compact Hardware Link Badge -->
    <div class="flex flex-col items-center gap-2 pt-2 border-t border-border-subtle w-full px-2">
      <div class="relative group flex items-center justify-center">
        <div class="w-10 h-10 rounded-xl bg-surface-2 border border-border flex items-center justify-center text-status-ok cursor-default">
          <span class="material-symbols-outlined text-[18px]">usb</span>
        </div>
        <span class="absolute left-full ml-3 px-2.5 py-1 bg-surface-2 border border-border text-xs font-mono text-text-secondary rounded-lg shadow-xl opacity-0 pointer-events-none group-hover:opacity-100 transition-opacity duration-150 whitespace-nowrap z-50">
          WinUSB Bulk · <span id="aside-com-port" class="text-status-ok font-semibold">COM4</span> · <span id="aside-format-badge">96kHz/24b</span>
        </span>
      </div>
    </div>
  </aside>

  <!-- Main Viewport Container (Locked padding & centered to prevent stretching on maximize) -->
  <div class="pl-16">
    <main class="w-full pt-10 min-h-screen bg-background p-4 md:p-8 flex flex-col items-center justify-start">
<!-- {{TAB_PANELS}} -->

    </main>
  </div>

  <!-- Unified Application Script with Native WebView2 Bridge Adapter -->
<!-- {{SCRIPTS}} -->
</body>
</html>
