<!DOCTYPE html>
<html class="dark" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="web_dashboard" name="shell-type"/>
  <title>LG HT306 Audio Bridge</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "text-secondary": "#B8B8BC",
            "text-primary": "#FFFFFF",
            "on-tertiary": "#00391c",
            "surface-dim": "#131313",
            "secondary-fixed": "#d6e3ff",
            "primary-fixed-dim": "#ffb2b8",
            "on-primary-container": "#ffafb5",
            error: "#ffb4ab",
            "outline-variant": "#5a4042",
            "on-secondary": "#003063",
            "on-surface": "#e5e2e1",
            "surface-container-low": "#1c1b1b",
            surface: "#1C1C1E",
            "surface-container": "#201f1f",
            "inverse-surface": "#e5e2e1",
            "on-surface-variant": "#e2bec0",
            "primary-container": "#a50034",
            "on-background": "#e5e2e1",
            "on-tertiary-fixed": "#00210e",
            "surface-container-high": "#2a2a2a",
            border: "#38383A",
            "surface-variant": "#353534",
            "on-error-container": "#ffdad6",
            "on-secondary-container": "#d9e4ff",
            "on-secondary-fixed": "#001b3d",
            "secondary-container": "#0464c3",
            "on-tertiary-container": "#54dd8b",
            "icon-gray": "#6B6B6B",
            primary: "#ffb2b8",
            "status-ok": "#2FBF71",
            background: "#131313",
            "on-error": "#690005",
            "status-error": "#FF5A5F",
            "on-primary": "#67001d",
            "tertiary-container": "#005e32",
            "surface-container-highest": "#353534",
            "status-warn": "#F5A623",
            "on-primary-fixed-variant": "#91002d",
            "on-tertiary-fixed-variant": "#00522b",
            "lg-red-pressed": "#7D0027",
            "secondary-fixed-dim": "#a9c7ff",
            "surface-container-lowest": "#0e0e0e",
            "lg-red-hover": "#C2174A",
            secondary: "#a9c7ff",
            "tertiary-fixed-dim": "#57df8d",
            "surface-tint": "#ffb2b8",
            "surface-2": "#262628",
            tertiary: "#57df8d",
            "status-info": "#5B9DFF",
            "tertiary-fixed": "#75fca7",
            "surface-bright": "#393939",
            "primary-fixed": "#ffdadb",
            "on-primary-fixed": "#40000f",
            outline: "#a9898b",
            "inverse-on-surface": "#313030",
            "lg-red-tint": "#A5003426",
            "inverse-primary": "#b81840",
            "on-secondary-fixed-variant": "#00468c",
            "error-container": "#93000a"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "0.75rem",
            "space-xl": "1.5rem",
            gutter: "1rem",
            "space-lg": "1rem",
            margin: "1.25rem"
          },
          fontFamily: {
            "body-sm": ["Plus Jakarta Sans"],
            caption: ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "code-lg": ["JetBrains Mono"],
            "code-sm": ["JetBrains Mono"],
            "headline-md": ["Plus Jakarta Sans"],
            "meter-num": ["JetBrains Mono"]
          },
          fontSize: {
            "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            caption: ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            "code-lg": ["14px", { lineHeight: "20px", fontWeight: "500" }],
            "code-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "headline-md": ["20px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "meter-num": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "600" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background font-body-sm text-on-surface select-none min-h-screen">
  <!-- Shared Global Header -->
  <header class="fixed top-0 left-0 right-0 h-10 bg-surface-container-lowest z-50 flex items-center justify-between px-space-md border-b border-border select-none">
    <div class="flex items-center gap-space-md">
      <div class="flex items-center gap-space-xs text-primary-container">
        <span class="material-symbols-outlined text-[18px]">graphic_eq</span>
      </div>
      <div class="flex items-center gap-space-xs">
        <span class="font-code-sm text-code-sm text-text-primary font-medium tracking-tight">HT306 Audio Bridge</span>
        <span class="font-code-sm text-code-sm text-icon-gray">|</span>
        <span class="font-code-sm text-code-sm text-text-secondary">RP2350-Zero Direct-I2S</span>
      </div>
    </div>
    <div class="flex items-center gap-space-md">
      <div id="header-connection-badge" class="flex items-center gap-space-xs px-space-sm py-0.5 rounded-full bg-surface-2 border border-border">
        <span id="header-status-dot" class="w-2 h-2 rounded-full bg-status-ok"></span>
        <span id="header-status-text" class="font-code-sm text-code-sm text-status-ok font-medium">Connected</span>
      </div>
      <!-- Windows Taskbar Audio Device Badge -->
      <button id="header-audio-badge" type="button" class="flex items-center gap-space-xs px-space-sm py-0.5 rounded-full bg-surface-2 border border-border cursor-pointer hover:bg-surface-variant transition-colors" title="Windows Taskbar Audio Device (Klik untuk switch/pasang driver)" onclick="window.handleAudioBadgeClick(event)">
        <span id="header-audio-dot" class="w-2 h-2 rounded-full bg-icon-gray"></span>
        <span class="material-symbols-outlined text-[14px] text-text-secondary">volume_up</span>
        <span id="header-audio-text" class="font-code-sm text-code-sm text-text-secondary font-medium">Taskbar: Detecting...</span>
      </button>
      <div class="flex items-center gap-space-xs px-space-sm py-0.5 rounded-full bg-surface-2 border border-border cursor-pointer hover:bg-surface-variant transition-colors" onclick="switchTab('profiles')">
        <span class="font-code-sm text-code-sm text-text-secondary">Profile:</span>
        <span id="header-profile-text" class="font-code-sm text-code-sm text-text-primary font-medium">Movie</span>
        <span class="material-symbols-outlined text-text-secondary text-[16px]">arrow_drop_down</span>
      </div>
      <div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center">
        <span class="material-symbols-outlined text-text-primary text-[14px]">person</span>
      </div>
      <div class="flex items-center -mr-space-md ml-space-xs">
        <button id="btn-win-min" onclick="window.sendNativeCommand('window_minimize')" class="w-10 h-10 flex items-center justify-center text-text-secondary hover:bg-surface-2 hover:text-text-primary transition-colors cursor-pointer" type="button" title="Minimize"><span class="text-xs leading-none">─</span></button>
        <button id="btn-win-max" onclick="window.sendNativeCommand('window_maximize')" class="w-10 h-10 flex items-center justify-center text-text-secondary hover:bg-surface-2 hover:text-text-primary transition-colors cursor-pointer" type="button" title="Maximize"><span class="text-xs leading-none">▢</span></button>
        <button id="btn-win-close" onclick="window.sendNativeCommand('window_close')" class="w-10 h-10 flex items-center justify-center text-text-secondary hover:bg-status-error hover:text-text-primary transition-colors cursor-pointer" type="button" title="Close"><span class="text-xs leading-none">✕</span></button>
      </div>
    </div>
  </header>

  <!-- Shared Left Navigation Aside -->
  <aside class="fixed left-0 top-10 bottom-0 w-56 bg-surface-container-low border-r border-border z-40 flex flex-col justify-between py-space-md px-space-sm select-none">
    <div class="flex flex-col gap-space-xs">
      <div class="px-space-md py-space-xs flex items-center justify-between">
        <span class="font-caption text-caption text-icon-gray uppercase tracking-wider font-semibold">Audio Engine</span>
        <span id="aside-format-badge" class="font-meter-num text-meter-num text-tertiary px-1 py-0.5 rounded bg-surface-2">96kHz / 24b</span>
      </div>
      <nav class="flex flex-col gap-0.5 mt-space-xs" id="sidebar-nav">
        <button data-tab="dashboard" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm transition-colors bg-primary-container text-text-primary font-medium border-l-2 border-primary-container rounded-lg">
          <span class="material-symbols-outlined text-[18px]">dashboard</span>
          <span>Dashboard</span>
        </button>
        <button data-tab="mixer" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-text-secondary hover:bg-surface-2 hover:text-on-surface transition-colors font-body-sm text-body-sm">
          <span class="material-symbols-outlined text-[18px]">tune</span>
          <span>Mixer</span>
        </button>
        <button data-tab="routing" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-text-secondary hover:bg-surface-2 hover:text-on-surface transition-colors font-body-sm text-body-sm">
          <span class="material-symbols-outlined text-[18px]">alt_route</span>
          <span>Routing</span>
        </button>
        <button data-tab="profiles" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-text-secondary hover:bg-surface-2 hover:text-on-surface transition-colors font-body-sm text-body-sm">
          <span class="material-symbols-outlined text-[18px]">layers</span>
          <span>Profiles</span>
        </button>
        <button data-tab="test" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-text-secondary hover:bg-surface-2 hover:text-on-surface transition-colors font-body-sm text-body-sm">
          <span class="material-symbols-outlined text-[18px]">volume_up</span>
          <span>Test</span>
        </button>
        <button data-tab="log" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-text-secondary hover:bg-surface-2 hover:text-on-surface transition-colors font-body-sm text-body-sm">
          <span class="material-symbols-outlined text-[18px]">terminal</span>
          <span>Log</span>
        </button>
        <button data-tab="settings" class="nav-btn w-full text-left flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-text-secondary hover:bg-surface-2 hover:text-on-surface transition-colors font-body-sm text-body-sm">
          <span class="material-symbols-outlined text-[18px]">settings</span>
          <span>Settings</span>
        </button>
      </nav>
    </div>
    <div class="flex flex-col gap-space-xs px-space-sm pt-space-md border-t border-border">
      <div class="flex items-center justify-between text-text-secondary font-code-sm text-code-sm bg-surface-2 px-space-sm py-1 rounded">
        <span class="truncate text-text-secondary">WinUSB Bulk</span>
        <span class="text-border">|</span>
        <span id="aside-com-port" class="text-tertiary-fixed font-medium">COM4</span>
      </div>
      <div class="flex items-center justify-between px-space-xs">
        <span class="font-meter-num text-meter-num text-icon-gray">FIRMWARE BRIDGE</span>
        <span class="font-code-sm text-code-sm text-text-secondary">v1.3.0</span>
      </div>
    </div>
  </aside>

  <!-- Main Viewport Container -->
  <div class="pl-56">
    <main class="w-full pt-10 min-h-screen bg-background p-space-lg">
<!-- {{TAB_PANELS}} -->

    </main>
  </div>

  <!-- Unified Application Script with Native WebView2 Bridge Adapter -->
<!-- {{SCRIPTS}} -->
</body>
</html>
